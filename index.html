<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>中華電信讀書進度</title>
  <!-- 設定 Apple 設備的 APP 圖示 -->
  <link rel="apple-touch-icon" href="icon.png">
  <!-- 設定一般網頁標籤圖示 -->
  <link rel="icon" type="image/png" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    :root { --bg: #f4f5f7; --card: #ffffff; --primary: #1a73e8; --text: #3c4043; --text-light: #70757a; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background-color: var(--bg); color: var(--text); }
    
    .header { position: sticky; top: 0; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px); z-index: 1000; padding: 12px 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
    .tabs { display: flex; gap: 6px; }
    .tab { flex: 1; text-align: center; padding: 8px 0; font-size: 13px; font-weight: 600; border-radius: 8px; border: none; background: #e8eaed; color: #5f6368; cursor: pointer; transition: 0.2s; }
    .tab.active[data-target="todo"] { background: #e8f0fe; color: var(--primary); }
    .tab.active[data-target="delayed"] { background: #fef7e0; color: #b06000; }
    .tab.active[data-target="done"] { background: #e6f4ea; color: #137333; }
    
    .progress-container { margin-top: 12px; font-size: 11px; color: var(--text-light); text-align: center; font-weight: 500; }
    .progress-bar { background: #e8eaed; border-radius: 8px; height: 6px; width: 100%; margin-top: 6px; overflow: hidden; }
    .progress-fill { background: var(--primary); height: 100%; transition: width 0.4s ease; }
    
    .list-container { padding: 10px; padding-bottom: 40px; }
    .card { background: var(--card); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
    .card.done { opacity: 0.55; filter: grayscale(100%); }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .subject { font-size: 11px; background: #f1f3f4; padding: 3px 6px; border-radius: 4px; font-weight: 600; }
    .date-time { font-size: 11px; color: var(--text-light); }
    .card-title { font-size: 13.5px; font-weight: 700; margin: 0 0 8px 0; line-height: 1.4; }
    
    .controls { display: flex; justify-content: flex-end; gap: 8px; align-items: center; }
    .btn { padding: 6px 12px; font-size: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn-delay { background: #fce8e6; color: #c5221f; }
    .btn-undelay { background: #e8eaed; color: #3c4043; }
    .btn-done { background: #e6f4ea; color: #137333; }
    
    .time-picker { display: flex; align-items: center; gap: 4px; font-size: 12px; background: #f8f9fa; padding: 6px 8px; border-radius: 6px; margin-bottom: 8px; }
    .time-picker input { width: 35px; text-align: center; border: 1px solid #dadce0; border-radius: 4px; font-size: 13px; padding: 2px 0; }
    
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    #loading { text-align: center; padding: 20px; font-size: 14px; color: #70757a; display: none; }
  </style>
</head>
<body>

<div class="header">
  <div class="tabs">
    <button class="tab active" data-target="todo">⏳ 未完成 (<span id="count-todo">0</span>)</button>
    <button class="tab" data-target="delayed">⚠️ 延遲 (<span id="count-delayed">0</span>)</button>
    <button class="tab" data-target="done">✅ 已完成 (<span id="count-done">0</span>)</button>
  </div>
  <div class="progress-container">
    總進度：已完成 <span id="progress-text">0/0</span> 行程
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width: 0%;"></div></div>
  </div>
</div>

<div id="loading">🔄 同步雲端資料中...</div>

<div class="list-container">
  <div id="todo" class="tab-content active"></div>
  <div id="delayed" class="tab-content"></div>
  <div id="done" class="tab-content"></div>
</div>

<script>
// ⭐ 請將下方的網址換成您剛剛在 Apps Script 複製的網址
const API_URL = 'https://script.google.com/macros/s/AKfycbz3PM_iuR90RG-FhmGe_tC-RCdS7QKdFSMyiNbo4RMI5abtYyBseN4xqYJXT3NOnjf5/exec';

let tasks = [];

async function loadData() {
  document.getElementById('loading').style.display = 'block';
  try {
    const res = await fetch(API_URL);
    tasks = await res.json();
    render();
  } catch(e) {
    alert("讀取資料失敗，請確認網路與網址");
  } finally {
    document.getElementById('loading').style.display = 'none';
  }
}

async function updateStatus(id, newStatus) {
  // 樂觀更新 UI (先讓畫面改變，背景再進行同步)
  const t = tasks.find(x => x.id === id);
  t.status = newStatus;
  render();
  
  const sheetStatus = { 'todo': '未完成', 'delayed': '延遲待完成', 'done': '已完成' }[newStatus];
  try {
    await fetch(`${API_URL}?action=updateStatus&id=${id}&status=${encodeURIComponent(sheetStatus)}`);
  } catch(e) {
    alert("雲端同步失敗，請檢查網路！");
  }
}

let timeoutTimer;
async function syncTime(id, field, val) {
  const t = tasks.find(x => x.id === id);
  t[field] = parseInt(val) || 0;
  
  // 防抖動(Debounce)設計，避免使用者快速輸入時觸發太多次 API
  clearTimeout(timeoutTimer);
  timeoutTimer = setTimeout(async () => {
    try {
      await fetch(`${API_URL}?action=updateTime&id=${id}&h=${t.h}&m=${t.m}&s=${t.s}`);
    } catch(e) { console.error("時間同步失敗"); }
  }, 1000);
}

function render() {
  document.getElementById('todo').innerHTML = '';
  document.getElementById('delayed').innerHTML = '';
  document.getElementById('done').innerHTML = '';
  
  let counts = { todo: 0, delayed: 0, done: 0 };
  
  tasks.forEach(t => {
    counts[t.status]++;
    let html = `<div class="card ${t.status === 'done' ? 'done' : ''}">
      <div class="card-header">
        <span class="subject">${t.subject}</span>
        <span class="date-time">📅 ${t.date} | ⏱ ${t.time}</span>
      </div>
      <p class="card-title">${t.title}</p>`;
      
    if (t.status === 'todo') {
      html += `<div class="controls">
        <button class="btn btn-delay" onclick="updateStatus(${t.id}, 'delayed')">⚠️ 標記延遲</button>
        <button class="btn btn-done" onclick="updateStatus(${t.id}, 'done')">✅ 完成</button>
      </div>`;
    } else if (t.status === 'delayed') {
      html += `<div class="time-picker">
        📍 看到： 
        <input type="number" min="0" value="${t.h}" oninput="syncTime(${t.id}, 'h', this.value)">時
        <input type="number" min="0" max="59" value="${t.m}" oninput="syncTime(${t.id}, 'm', this.value)">分
        <input type="number" min="0" max="59" value="${t.s}" oninput="syncTime(${t.id}, 's', this.value)">秒
      </div>
      <div class="controls">
        <button class="btn btn-undelay" onclick="updateStatus(${t.id}, 'todo')">↩️ 回歸未完成</button>
        <button class="btn btn-done" onclick="updateStatus(${t.id}, 'done')">✅ 完成</button>
      </div>`;
    } else {
      html += `<div class="controls">
        <button class="btn btn-undelay" onclick="updateStatus(${t.id}, 'todo')">↩️ 轉為未完成</button>
      </div>`;
    }
    html += `</div>`;
    document.getElementById(t.status).innerHTML += html;
  });
  
  document.getElementById('count-todo').innerText = counts.todo;
  document.getElementById('count-delayed').innerText = counts.delayed;
  document.getElementById('count-done').innerText = counts.done;
  
  let total = tasks.length;
  let pct = total === 0 ? 0 : Math.round((counts.done / total) * 100);
  document.getElementById('progress-text').innerText = `${counts.done} / ${total} (${pct}%)`;
  document.getElementById('progress-fill').style.width = pct + '%';
}

document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', (e) => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    e.target.classList.add('active');
    document.getElementById(e.target.dataset.target).classList.add('active');
  });
});

// 啟動時自動載入 Google Sheet 資料
loadData();
</script>
</body>
</html>
