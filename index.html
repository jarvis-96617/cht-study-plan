<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>中華電信讀書進度</title>
  <meta name="theme-color" content="#f6f4ef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="讀書進度">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- 設定 Apple 設備的 APP 圖示 -->
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">
  <style>
    /* 色票取自 ICON：奶油白底、深藍灰線條、灰藍輔助線、鼠尾草綠進度 */
    :root {
      --bg: #f6f4ef;
      --card: #fffefb;
      --navy: #2f4058;
      --navy-soft: #4a5a72;
      --slate: #a9b0c0;
      --slate-bg: #eceef2;
      --track: #e4e3df;
      --green: #5f9e83;
      --green-deep: #3f7a61;
      --green-bg: #e4f0e9;
      --amber: #a8742a;
      --amber-bg: #f6ecd9;
      --clay: #a95a4e;
      --clay-bg: #f5e4e0;
      --line: #e8e5de;
      --text: #2f4058;
      --text-light: #7b8496;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
      margin: 0; padding: 0; background-color: var(--bg); color: var(--text);
    }

    /* ===== Header ===== */
    .header {
      position: sticky; top: 0; z-index: 1000;
      background: rgba(246, 244, 239, 0.92);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      padding: calc(12px + env(safe-area-inset-top, 0px)) 14px 12px;
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .brand img { width: 34px; height: 34px; border-radius: 10px; box-shadow: 0 1px 4px rgba(47,64,88,0.18); }
    .brand h1 { font-size: 17px; font-weight: 700; margin: 0; letter-spacing: 0.5px; color: var(--navy); }

    .tabs { display: flex; gap: 2px; background: #ebe8e1; padding: 3px; border-radius: 14px; }
    .tab {
      flex: 1; text-align: center; padding: 8px 0; font-size: 13px; font-weight: 600;
      border-radius: 11px; border: none; background: transparent; color: var(--text-light);
      cursor: pointer; transition: background 0.2s, color 0.2s, box-shadow 0.2s;
      font-family: inherit;
    }
    .tab.active { background: var(--card); box-shadow: 0 1px 4px rgba(47,64,88,0.14); }
    .tab.active[data-target="todo"] { color: var(--navy); }
    .tab.active[data-target="delayed"] { color: var(--amber); }
    .tab.active[data-target="done"] { color: var(--green-deep); }

    /* 進度條：仿 ICON 底部的膠囊進度條 */
    .progress-container { margin-top: 12px; font-size: 12px; color: var(--text-light); font-weight: 500; }
    .progress-label { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
    .progress-label b { color: var(--navy); font-weight: 700; font-variant-numeric: tabular-nums; }
    .progress-bar {
      border: 2.5px solid var(--navy); border-radius: 999px; padding: 2.5px;
      background: var(--card); width: 100%;
    }
    .progress-track { background: var(--track); border-radius: 999px; height: 10px; overflow: hidden; }
    .progress-fill {
      background: linear-gradient(90deg, #6fae92, var(--green));
      height: 100%; border-radius: 999px; transition: width 0.4s ease;
    }

    /* ===== 清單與卡片 ===== */
    .list-container { padding: 14px; padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px)); }
    .card {
      background: var(--card); border-radius: 16px; padding: 12px 14px; margin-bottom: 10px;
      border: 1px solid var(--line);
      box-shadow: 0 1px 3px rgba(47,64,88,0.06), 0 6px 14px -8px rgba(47,64,88,0.12);
    }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; }
    .subject { font-size: 11.5px; background: var(--slate-bg); color: var(--navy-soft); padding: 3px 9px; border-radius: 999px; font-weight: 600; }
    .date-time { font-size: 11px; color: var(--text-light); font-variant-numeric: tabular-nums; }
    .card-title { font-size: 14px; font-weight: 700; margin: 0 0 10px 0; line-height: 1.5; color: var(--navy); }

    .card.done { background: #fbfaf6; }
    .card.done .card-title { color: var(--text-light); font-weight: 600; text-decoration: line-through; text-decoration-color: var(--slate); }
    .card.done .subject { background: var(--green-bg); color: var(--green-deep); }

    .controls { display: flex; justify-content: flex-end; gap: 8px; align-items: center; }
    .btn {
      padding: 8px 14px; font-size: 12.5px; border: none; border-radius: 999px; cursor: pointer;
      font-weight: 600; font-family: inherit; transition: transform 0.1s, filter 0.15s;
    }
    .btn:active { transform: scale(0.96); }
    .btn-delay { background: var(--clay-bg); color: var(--clay); }
    .btn-undelay { background: var(--slate-bg); color: var(--navy-soft); }
    .btn-done { background: var(--green); color: #fff; }

    /* 延遲時的時間選擇器 */
    .time-picker {
      display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 12.5px; color: var(--navy-soft);
      background: var(--amber-bg); padding: 8px 10px; border-radius: 12px; margin-bottom: 10px;
    }
    .time-picker select {
      text-align: center; text-align-last: center;
      border: 1px solid #e3d3b3; border-radius: 8px; font-size: 14px; font-weight: 600;
      padding: 5px 6px; min-width: 46px; color: var(--navy); background-color: #fffdf8;
      font-family: inherit; font-variant-numeric: tabular-nums;
      appearance: none; -webkit-appearance: none;
    }

    .empty { text-align: center; color: var(--text-light); font-size: 13px; padding: 48px 0; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    #loading { text-align: center; padding: 16px; font-size: 13px; color: var(--text-light); display: none; }

    .tab:focus-visible, .btn:focus-visible, .time-picker select:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>

<div class="header">
  <div class="brand">
    <img src="icon.png" alt="">
    <h1>中華電信讀書進度</h1>
  </div>
  <div class="tabs">
    <button class="tab active" data-target="todo">未完成 <span id="count-todo">0</span></button>
    <button class="tab" data-target="delayed">延遲 <span id="count-delayed">0</span></button>
    <button class="tab" data-target="done">已完成 <span id="count-done">0</span></button>
  </div>
  <div class="progress-container">
    <div class="progress-label">
      <span>總進度</span>
      <b id="progress-text">0 / 0</b>
    </div>
    <div class="progress-bar"><div class="progress-track"><div class="progress-fill" id="progress-fill" style="width: 0%;"></div></div></div>
  </div>
</div>

<div id="loading">🔄 同步雲端資料中...</div>

<div class="list-container">
  <div id="todo" class="tab-content active"></div>
  <div id="delayed" class="tab-content"></div>
  <div id="done" class="tab-content"></div>
</div>

<script>
// ⭐ 請將下方的網址換成您的 Apps Script 網址
const API_URL = 'https://script.google.com/macros/s/AKfycbz3PM_iuR90RG-FhmGe_tC-RCdS7QKdFSMyiNbo4RMI5abtYyBseN4xqYJXT3NOnjf5/exec';

let tasks = [];

// 輔助函數：用來產生 00~59 的選單選項
function getOptions(max, selectedValue) {
  let opts = '';
  for(let i = 0; i <= max; i++) {
    let padded = i.toString().padStart(2, '0');
    // 使用 == 確保數字與字串型態都能正確比對
    let isSelected = (i == selectedValue) ? 'selected' : ''; 
    opts += `<option value="${i}" ${isSelected}>${padded}</option>`;
  }
  return opts;
}

async function loadData() {
  document.getElementById('loading').style.display = 'block';
  try {
    const res = await fetch(API_URL);
    tasks = await res.json();
    render();
  } catch(e) {
    alert("讀取資料失敗，請確認網路與網址");
  } finally {
    document.getElementById('loading').style.display = 'none';
  }
}

async function updateStatus(id, newStatus) {
  const t = tasks.find(x => x.id === id);
  t.status = newStatus;
  render();
  
  const sheetStatus = { 'todo': '未完成', 'delayed': '延遲待完成', 'done': '已完成' }[newStatus];
  try {
    await fetch(`${API_URL}?action=updateStatus&id=${id}&status=${encodeURIComponent(sheetStatus)}`);
  } catch(e) {
    alert("雲端同步失敗，請檢查網路！");
  }
}

let timeoutTimer;
async function syncTime(id, field, val) {
  const t = tasks.find(x => x.id === id);
  t[field] = parseInt(val) || 0;
  
  clearTimeout(timeoutTimer);
  timeoutTimer = setTimeout(async () => {
    try {
      await fetch(`${API_URL}?action=updateTime&id=${id}&h=${t.h}&m=${t.m}&s=${t.s}`);
    } catch(e) { console.error("時間同步失敗"); }
  }, 1000);
}

function render() {
  const emptyText = { todo: '全部完成了，太棒了 🎉', delayed: '目前沒有延遲的項目', done: '還沒有完成的項目' };
  document.getElementById('todo').innerHTML = '';
  document.getElementById('delayed').innerHTML = '';
  document.getElementById('done').innerHTML = '';
  
  let counts = { todo: 0, delayed: 0, done: 0 };
  
  tasks.forEach(t => {
    counts[t.status]++;
    let html = `<div class="card ${t.status === 'done' ? 'done' : ''}">
      <div class="card-header">
        <span class="subject">${t.subject}</span>
        <span class="date-time">📅 ${t.date} | ⏱ ${t.time}</span>
      </div>
      <p class="card-title">${t.title}</p>`;
      
    if (t.status === 'todo') {
      html += `<div class="controls">
        <button class="btn btn-delay" onclick="updateStatus(${t.id}, 'delayed')">標記延遲</button>
        <button class="btn btn-done" onclick="updateStatus(${t.id}, 'done')">✓ 完成</button>
      </div>`;
    } else if (t.status === 'delayed') {
      // 下拉選單：手機點擊時會觸發原生滾輪
      html += `<div class="time-picker">
        📍 看到
        <select onchange="syncTime(${t.id}, 'h', this.value)">
          ${getOptions(23, t.h)}
        </select> 時
        <select onchange="syncTime(${t.id}, 'm', this.value)">
          ${getOptions(59, t.m)}
        </select> 分
        <select onchange="syncTime(${t.id}, 's', this.value)">
          ${getOptions(59, t.s)}
        </select> 秒
      </div>
      <div class="controls">
        <button class="btn btn-undelay" onclick="updateStatus(${t.id}, 'todo')">回歸未完成</button>
        <button class="btn btn-done" onclick="updateStatus(${t.id}, 'done')">✓ 完成</button>
      </div>`;
    } else {
      html += `<div class="controls">
        <button class="btn btn-undelay" onclick="updateStatus(${t.id}, 'todo')">轉為未完成</button>
      </div>`;
    }
    html += `</div>`;
    document.getElementById(t.status).innerHTML += html;
  });

  // 空清單提示
  ['todo', 'delayed', 'done'].forEach(k => {
    if (counts[k] === 0 && tasks.length > 0) {
      document.getElementById(k).innerHTML = `<div class="empty">${emptyText[k]}</div>`;
    }
  });
  
  document.getElementById('count-todo').innerText = counts.todo;
  document.getElementById('count-delayed').innerText = counts.delayed;
  document.getElementById('count-done').innerText = counts.done;
  
  let total = tasks.length;
  let pct = total === 0 ? 0 : Math.round((counts.done / total) * 100);
  document.getElementById('progress-text').innerText = `${counts.done} / ${total}（${pct}%）`;
  document.getElementById('progress-fill').style.width = pct + '%';
}

document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', (e) => {
    const target = e.currentTarget;
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    target.classList.add('active');
    document.getElementById(target.dataset.target).classList.add('active');
  });
});

loadData();
</script>
</body>
</html>
